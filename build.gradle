plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.salvereminder.SalveReminderPluginLauncher'

configurations {
	runeLiteRuntime.extendsFrom compileOnly
}

sourceSets {
	launcher {
		java.srcDir 'src/launcher/java'
		compileClasspath = sourceSets.main.output + configurations.runeLiteRuntime
		runtimeClasspath = output + compileClasspath
	}
}

dependencies {
	compileOnly "net.runelite:client:$runeLiteVersion"

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation "net.runelite:client:$runeLiteVersion"
}

group = 'com.salvereminder'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
	options.compilerArgs.add('-Xlint:all')
}

tasks.register('run', JavaExec) {
	group = BasePlugin.BUILD_GROUP
	classpath = sourceSets.launcher.runtimeClasspath
	mainClass = pluginMainClass
	enableAssertions = true
	args '--developer-mode'
	args '--debug'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.runeLiteRuntime
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from(sourceSets.launcher.output) {
		include 'com/salvereminder/SalveReminderPluginLauncher.class'
	}
	from {
		configurations.runeLiteRuntime.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
